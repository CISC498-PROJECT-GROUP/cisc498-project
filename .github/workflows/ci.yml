# Every PR and every push to main: typecheck, test, format check and an extension build.
# The same commands run locally — `bun run lint && bun run test && bun run format:check`.
name: CI

on:
    pull_request:
    push:
        branches: [main]

# A newer push to the same branch makes the older run pointless.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14
            - run: bun install --frozen-lockfile
            - name: Typecheck
              run: bun run lint
            - name: Test
              run: bun run test
            - name: Format
              run: bun run format:check
            - name: Build extension
              run: bun run build
