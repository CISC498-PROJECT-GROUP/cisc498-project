# Pushing a tag `vX.Y.Z` builds the site and attaches its static files (web/dist) to a GitHub Release
# as a zip, for any static host that relays /api/* to the backend. The tag must match web/package.json.
name: Release

on:
    push:
        tags: ['v*']

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14
            - run: bun install --frozen-lockfile
            - run: bun run lint && bun run test
            - name: Check tag matches the site's version
              run: |
                  version=$(bun -e "console.log(require('./web/package.json').version)")
                  if [ "v$version" != "$GITHUB_REF_NAME" ]; then
                      echo "::error::tag $GITHUB_REF_NAME does not match web/package.json version $version"
                      exit 1
                  fi
            - name: Build site
              run: bun run build
            - name: Zip and publish
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  zip_name="canvas-assistant-$GITHUB_REF_NAME.zip"
                  (cd web/dist && zip -r "../../$zip_name" .)
                  gh release create "$GITHUB_REF_NAME" "$zip_name" --title "$GITHUB_REF_NAME" --generate-notes
